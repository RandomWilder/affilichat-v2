apiVersion: apps/v1
kind: Deployment
metadata:
  name: affilichat
  namespace: affilichat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: affilichat
  template:
    metadata:
      labels:
        app: affilichat
    spec:
      containers:
      - name: affilichat-combined
        image: gcr.io/affilichat-v2/affilichat-combined:v1.0
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: affilichat-api-keys
              key: OPENAI_API_KEY
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: affilichat-api-keys
              key: PINECONE_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: affilichat-api-keys
              key: OPENROUTER_API_KEY
        # Firebase environment variables
        - name: FIREBASE_API_KEY
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_API_KEY
        - name: FIREBASE_AUTH_DOMAIN
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_AUTH_DOMAIN
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_PROJECT_ID
        - name: FIREBASE_STORAGE_BUCKET
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_STORAGE_BUCKET
        - name: FIREBASE_MSG_SENDER_ID
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_MSG_SENDER_ID
        - name: FIREBASE_APP_ID
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_APP_ID
        # Vite Firebase environment variables
        - name: VITE_FIREBASE_API_KEY
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_API_KEY
        - name: VITE_FIREBASE_AUTH_DOMAIN
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_AUTH_DOMAIN
        - name: VITE_FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_PROJECT_ID
        - name: VITE_FIREBASE_STORAGE_BUCKET
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_STORAGE_BUCKET
        - name: VITE_FIREBASE_MESSAGING_SENDER_ID
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_MSG_SENDER_ID
        - name: VITE_FIREBASE_APP_ID
          valueFrom:
            secretKeyRef:
              name: affilichat-firebase-config
              key: FIREBASE_APP_ID
        # Add explicit logging variables to troubleshoot
        - name: FLASK_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "DEBUG"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # Mount the Firebase service account key
        volumeMounts:
        - name: firebase-key
          mountPath: /app/firebase-key.json
          subPath: firebase-key.json
          readOnly: true
      volumes:
      - name: firebase-key
        secret:
          secretName: affilichat-firebase-key
          items:
          - key: firebase-key.json
            path: firebase-key.json 